name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Release notes for the manifest version
        run: node tests/release-notes.mjs "$(node -p 'require("./manifest.json").version')" "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/title.txt"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: pwsh build.ps1
      - run: npm run lint:firefox
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-output
          path: tests/out/
